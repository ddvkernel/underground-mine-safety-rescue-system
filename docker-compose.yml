version: '3.8'

services:
  # Real-time Control Room Web Dashboard & Serial Gateway Service
  mine-safety-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mine_safety_dashboard
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - HOST=0.0.0.0
      - PORT=5000
      - SERIAL_PORT=/dev/ttyUSB0
      - BAUD_RATE=115200
    volumes:
      # Mount insights directory to persist live safety logs and generated Excel reports
      - ./insights:/app/insights
      # Mount data directory for sensor training benchmarks
      - ./data:/app/data
    # Optional hardware pass-through: Uncomment on Linux if ESP32 USB gateway is plugged in
    # devices:
    #   - "/dev/ttyUSB0:/dev/ttyUSB0"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/data')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ML Analytics & Offline Report Generation Engine
  ml-analytics:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mine_safety_ml
    profiles:
      - ml
    restart: "no"
    command: ["python", "sih_model.py", "--insights"]
    environment:
      - SERIAL_PORT=/dev/ttyUSB0
      - BAUD_RATE=115200
    volumes:
      - ./insights:/app/insights
      - ./data:/app/data
